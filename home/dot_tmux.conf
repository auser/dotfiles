# Simple tmux configuration

# -- Basic settings ----------------------------------------------------------

# Change the default prefix to Ctrl-a (like screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# tmux is the terminal seen by applications running inside a pane. Keep the
# outer terminal (Alacritty) advertised separately for RGB and OSC 52 clipboard
# support. Alacritty reports xterm-256color in this dotfiles configuration.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set-option -g default-terminal "tmux-256color"' \
    'set-option -g default-terminal "screen-256color"'
set-option -as terminal-features ',xterm-256color:RGB:clipboard'

# Only tmux itself may write copied text to the outer terminal clipboard.
# Applications inside tmux cannot use this setting to read or replace it.
set-option -s set-clipboard external

set -g history-limit 10000
set -s escape-time 10

# Window and pane settings
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# -- Status bar ----------------------------------------------------------

# Simple status bar with session name and time
set -g status-style bg=black,fg=white
set -g status-left '#[fg=green][#S] '
set -g status-left-length 20
set -g status-right '#[fg=green]%H:%M #[fg=white]%d-%b-%y'
set -g status-right-length 50

# Window and pane colors
setw -g window-status-current-style fg=black,bg=green
setw -g window-status-style fg=white,bg=black
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=green
set-window-option -g xterm-keys on
set -g assume-paste-time 0
set -g focus-events on


# -- Key bindings ----------------------------------------------------------

# Reload config
bind r source-file ~/.tmux.conf \; display "Configuration reloaded!"

# Toggle tmux mouse capture. With mouse mode off, Alacritty handles normal
# click-and-drag selection itself; with it on, dragging copies through tmux.
bind m set-option -g mouse \; display-message "Mouse mode: #{?mouse,on,off}"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Create new window with current path
bind c new-window -c "#{pane_current_path}"

# Navigate panes with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window navigation
unbind n
unbind p
bind -r C-h previous-window # select previous window
bind -r C-l next-window     # select next window
bind Tab last-window        # move to last active window

# Rename current pane
bind , command-prompt -p "Pane name:" "select-pane -T '%%'"

# Rename current window
bind . command-prompt -p "Window name:" "rename-window '%%'"

# -- Copy mode ----------------------------------------------------------

# Vim-style copy mode. The -e flag returns to the live pane automatically when
# scrolling reaches the bottom of history.
setw -g mode-keys vi
bind [ copy-mode -e

# Page Up works directly at a shell prompt. Preserve Page Up for full-screen
# applications such as Vim and less, which manage their own scrollback.
bind-key -n PageUp if-shell -F '#{alternate_on}' \
    'send-keys PageUp' \
    'copy-mode -e -u'

# Physical paging keys inside copy mode. Page Down exits as soon as it reaches
# the live screen instead of leaving the pane stranded in scrollback.
bind -T copy-mode-vi PageUp send-keys -X page-up
bind -T copy-mode-vi PageDown send-keys -X page-down-and-cancel

# Obvious escape hatches from copy mode.
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi C-c send-keys -X cancel

# Keyboard and mouse selections are copied to both tmux's paste buffer and the
# host clipboard. Mouse selection copies automatically when the button is
# released. Hold Shift while dragging for Alacritty's native selection instead.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Search
bind / copy-mode \; command-prompt -p "Search:" "send -X search-forward \"%%%\""
bind ? copy-mode \; command-prompt -p "Search:" "send -X search-backward \"%%%\""
bind -T copy-mode-vi n send-keys -X search-again
bind -T copy-mode-vi N send-keys -X search-reverse

# -- Session management ----------------------------------------------------------

# List and create sessions
bind s choose-session
bind S command-prompt -p "New Session:" "new-session -s '%%'"

# -- Environment ----------------------------------------------------------

# Preserve essential environment variables
set-option -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY"


# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


# -- Load local customizations if they exist
if-shell "[ -f ~/.tmux.conf.local ]" 'source ~/.tmux.conf.local'
